name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & selftest
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: ./build.sh --test

      - name: Set up signing
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./Tools/ci-setup-signing.sh

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Native plugins and signed runtime
        run: ./Tools/test-plugins.sh

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Vorssaint-dmg
          path: dist/*.dmg
          if-no-files-found: error

  plugin-tools:
    name: Plugin SDK and package tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.1
      - name: Install plugin tooling
        run: |
          npm install --global pnpm@10.28.2 --ignore-scripts
          pnpm --dir Packages install --frozen-lockfile --ignore-scripts
      - name: Check SDK and examples
        run: pnpm --dir Packages check
      - name: Test packages and real plugin processes
        run: pnpm --dir Packages test
      - name: Build examples
        run: pnpm --dir Packages build:examples
